name: Python Unit Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
    # We need to checkout our code into the github action runner and use explicit checkout version 4 -> @v4
    - name: Checkout code
      uses: actions/checkout@v4 

    # After our code is on the runner, we need to install python on it
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    
    # Install dependencies if there is a requirement file
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt || true 

    # Now, we have everything we need to execute our tests
    - name: Execute unit tests
      run: |
        python -m unittest Unit_test

    
